<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERCENTAGE CALCULATOR - เครื่องคำนวณเปอร์เซ็นต์</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0F172A',
                        cardBg: '#1E293B',
                        inputBg: '#334155',
                        brandBlue: '#38BDF8',
                        brandGreen: '#22C55E',
                        brandRed: '#EF4444',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for animations & custom scrollbar */
        body {
            background-color: #0F172A;
            color: #F8FAFC;
        }
        /* Hide arrows from number input */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .mode-transition {
            transition: all 0.3s ease-in-out;
        }
        /* Toast Notification Animation */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        .toast-animate {
            animation: fadeInOut 2.5s forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-6 font-sans antialiased select-none">

    <div class="w-full max-w-xl bg-cardBg border border-slate-700/60 rounded-3xl shadow-2xl overflow-hidden backdrop-blur-md">
        
        <!-- Header & Mode Switcher -->
        <div class="p-5 md:p-6 pb-4 border-b border-slate-700/50">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-8 bg-brandBlue rounded-full"></div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white uppercase">PERCENTAGE CALCULATOR</h1>
                        <p class="text-xs text-slate-400">เครื่องมือคำนวณเปอร์เซ็นต์จากยอดเต็ม</p>
                    </div>
                </div>
                <!-- Mode Toggle Badge -->
                <span id="modeBadge" class="px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 transition-all">
                    โหมดบวก (+%)
                </span>
            </div>

            <!-- Mode Selector Switch -->
            <div class="grid grid-cols-2 gap-2 p-1.5 bg-slate-900/80 rounded-2xl border border-slate-700/50">
                <button id="btnModeAdd" onclick="setMode('add')" class="mode-transition py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-lg shadow-emerald-900/40">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                    <span>บวกเปอร์เซ็นต์ (+%)</span>
                </button>
                <button id="btnModeSub" onclick="setMode('subtract')" class="mode-transition py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"></path></svg>
                    <span>ลบเปอร์เซ็นต์ (-%)</span>
                </button>
            </div>
        </div>

        <!-- Input Section -->
        <div class="p-5 md:p-6 space-y-5">
            <!-- Full Amount Input -->
            <div>
                <label class="block text-xs md:text-sm font-medium text-slate-300 mb-1.5">
                    ยอดเต็ม (Full Amount) <span class="text-rose-400">*</span>
                </label>
                <div class="relative">
                    <input type="text" id="fullAmount" inputmode="decimal" placeholder="0.00" 
                        oninput="handleInput(this); calculate();"
                        class="w-full bg-inputBg border-2 border-slate-600 focus:border-brandBlue focus:ring-0 rounded-2xl px-4 py-3.5 text-xl md:text-2xl font-bold text-white placeholder-slate-500 outline-none transition">
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">บาท</span>
                </div>
            </div>

            <!-- Percentage Input & Quick Selector -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="text-xs md:text-sm font-medium text-slate-300">
                        เปอร์เซ็นต์ (Percentage) <span class="text-rose-400">*</span>
                    </label>
                    <div class="flex items-center gap-2">
                        <span id="modeOperationLabel" class="text-xs font-medium text-emerald-400">บวกเพิ่มเข้ายอดเต็ม</span>
                        <button onclick="clearPercentInput()" class="text-xs text-slate-400 hover:text-rose-400 underline transition active:scale-95">ล้าง %</button>
                    </div>
                </div>
                
                <div class="relative mb-3">
                    <input type="text" id="percentage" inputmode="decimal" placeholder="0" 
                        oninput="handleInput(this); calculate();"
                        class="w-full bg-inputBg border-2 border-slate-600 focus:border-brandBlue focus:ring-0 rounded-2xl px-4 py-3.5 pr-16 text-xl md:text-2xl font-bold text-white placeholder-slate-500 outline-none transition">
                    <button onclick="clearPercentInput()" class="absolute right-9 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition p-1" title="ลบเปอร์เซ็นต์">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">%</span>
                </div>

                <!-- Quick Percentage Buttons -->
                <div class="grid grid-cols-4 sm:grid-cols-8 gap-1.5">
                    <button onclick="setQuickPercent(1)" class="py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl font-semibold text-xs transition active:scale-95">1%</button>
                    <button onclick="setQuickPercent(3)" class="py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl font-semibold text-xs transition active:scale-95">3%</button>
                    <button onclick="setQuickPercent(5)" class="py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl font-semibold text-xs transition active:scale-95">5%</button>
                    <button onclick="setQuickPercent(10)" class="py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl font-semibold text-xs transition active:scale-95">10%</button>
                    <button onclick="setQuickPercent(15)" class="py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl font-semibold text-xs transition active:scale-95">15%</button>
                    <button onclick="setQuickPercent(20)" class="py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl font-semibold text-xs transition active:scale-95">20%</button>
                    <button onclick="setQuickPercent(25)" class="py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl font-semibold text-xs transition active:scale-95">25%</button>
                    <button onclick="setQuickPercent(50)" class="py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl font-semibold text-xs transition active:scale-95">50%</button>
                </div>
            </div>
        </div>

        <!-- Result Display Card -->
        <div class="px-5 md:px-6 py-4">
            <div id="resultCard" class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-5 md:p-6 transition-all duration-300 relative overflow-hidden">
                <!-- Decorative background glow -->
                <div id="glowBg" class="absolute -right-10 -bottom-10 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Summary Breakdown -->
                <div class="grid grid-cols-2 gap-4 pb-4 border-b border-slate-800">
                    <div>
                        <span class="text-xs text-slate-400 block mb-1">ยอดเต็ม</span>
                        <div class="text-base md:text-lg font-semibold text-slate-200 truncate">
                            <span id="displayFullAmount">0</span> <span class="text-xs text-slate-400">บาท</span>
                        </div>
                    </div>
                    <div>
                        <span id="percentValLabel" class="text-xs text-emerald-400 block mb-1">มูลค่า (+%)</span>
                        <div class="text-base md:text-lg font-semibold text-emerald-400 truncate" id="percentValWrapper">
                            <span id="displayPercentValue">0</span> <span class="text-xs text-slate-400">บาท</span>
                        </div>
                    </div>
                </div>

                <!-- Main Net Result (Large Display) -->
                <div class="pt-4 text-center">
                    <span class="text-xs md:text-sm font-medium text-slate-400 uppercase tracking-wider block mb-1">ยอดสุทธิหลังคำนวณ (Net Amount)</span>
                    <div class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight my-1 text-emerald-400 break-words transition-colors" id="displayNetAmount">
                        0.00
                    </div>
                    <span class="text-xs text-slate-500 font-medium">บาท</span>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="p-5 md:p-6 pt-2 grid grid-cols-2 gap-3">
            <button onclick="resetCalculator()" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition active:scale-95">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>ล้างข้อมูล (RESET)</span>
            </button>
            
            <button onclick="copyResult()" class="py-3 px-4 bg-brandBlue/10 hover:bg-brandBlue/20 text-brandBlue border border-brandBlue/30 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                <span>คัดลอกยอดสุทธิ</span>
            </button>
        </div>

        <!-- Footer -->
        <div class="bg-slate-950/60 py-3 text-center border-t border-slate-800/80">
            <p class="text-xs text-slate-500">PERCENTAGE CALCULATOR • Works Offline & Real-time</p>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

    <script>
        // Application State
        let currentMode = 'add'; // 'add' or 'subtract'

        // DOM Elements
        const fullAmountInput = document.getElementById('fullAmount');
        const percentageInput = document.getElementById('percentage');
        
        const displayFullAmount = document.getElementById('displayFullAmount');
        const displayPercentValue = document.getElementById('displayPercentValue');
        const displayNetAmount = document.getElementById('displayNetAmount');
        
        const btnModeAdd = document.getElementById('btnModeAdd');
        const btnModeSub = document.getElementById('btnModeSub');
        const modeBadge = document.getElementById('modeBadge');
        const modeOperationLabel = document.getElementById('modeOperationLabel');
        const percentValLabel = document.getElementById('percentValLabel');
        const percentValWrapper = document.getElementById('percentValWrapper');
        const glowBg = document.getElementById('glowBg');

        /**
         * Filter input to only allow valid decimal numbers
         * Handles comma formatting during typing safely
         */
        function handleInput(input) {
            // Save cursor position
            let cursorPosition = input.selectionStart;
            let originalLength = input.value.length;

            // Strip invalid non-numeric chars except dot
            let val = input.value.replace(/[^0-9.]/g, '');
            
            // Ensure single decimal point
            const parts = val.split('.');
            if (parts.length > 2) {
                val = parts[0] + '.' + parts.slice(1).join('');
            }
            
            // Format integer part with commas if applicable
            if (parts[0]) {
                const formattedInt = Number(parts[0]).toLocaleString('en-US');
                val = parts.length > 1 ? formattedInt + '.' + parts[1] : formattedInt;
            }

            input.value = val;
        }

        /**
         * Helper to parse clean float numbers from formatted strings
         */
        function parseCleanNumber(valString) {
            if (!valString) return 0;
            const cleanStr = valString.toString().replace(/,/g, '');
            const parsed = parseFloat(cleanStr);
            return isNaN(parsed) ? 0 : parsed;
        }

        /**
         * Helper to format numbers nicely for display
         */
        function formatDisplayNumber(num, maxDecimals = 2) {
            return num.toLocaleString('en-US', {
                minimumFractionDigits: 0,
                maximumFractionDigits: maxDecimals
            });
        }

        /**
         * Change Calculator Mode (Add or Subtract)
         */
        function setMode(mode) {
            currentMode = mode;

            if (mode === 'add') {
                // Button Styling
                btnModeAdd.className = 'mode-transition py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-lg shadow-emerald-900/40';
                btnModeSub.className = 'mode-transition py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200';
                
                // Labels & Badges
                modeBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 transition-all';
                modeBadge.innerText = 'โหมดบวก (+%)';
                
                modeOperationLabel.className = 'text-xs font-medium text-emerald-400';
                modeOperationLabel.innerText = 'บวกเพิ่มเข้ายอดเต็ม';
                
                percentValLabel.className = 'text-xs text-emerald-400 block mb-1';
                percentValLabel.innerText = 'มูลค่า (+%)';
                
                percentValWrapper.className = 'text-base md:text-lg font-semibold text-emerald-400 truncate';
                displayNetAmount.className = 'text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight my-1 text-emerald-400 break-words transition-colors';
                
                glowBg.className = 'absolute -right-10 -bottom-10 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none';
            } else {
                // Button Styling
                btnModeSub.className = 'mode-transition py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 bg-rose-600 text-white shadow-lg shadow-rose-900/40';
                btnModeAdd.className = 'mode-transition py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200';
                
                // Labels & Badges
                modeBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/30 transition-all';
                modeBadge.innerText = 'โหมดลบ (-%)';
                
                modeOperationLabel.className = 'text-xs font-medium text-rose-400';
                modeOperationLabel.innerText = 'หักออกจากยอดเต็ม';
                
                percentValLabel.className = 'text-xs text-rose-400 block mb-1';
                percentValLabel.innerText = 'มูลค่า (-%)';
                
                percentValWrapper.className = 'text-base md:text-lg font-semibold text-rose-400 truncate';
                displayNetAmount.className = 'text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight my-1 text-rose-400 break-words transition-colors';
                
                glowBg.className = 'absolute -right-10 -bottom-10 w-40 h-40 bg-rose-500/10 rounded-full blur-3xl pointer-events-none';
            }

            calculate();
        }

        /**
         * Set percentage from quick selection buttons
         */
        function setQuickPercent(val) {
            percentageInput.value = val;
            calculate();
        }

        /**
         * Clear only percentage input
         */
        function clearPercentInput() {
            percentageInput.value = '';
            calculate();
            percentageInput.focus();
        }

        /**
         * Main Calculation Logic
         */
        function calculate() {
            const rawFullAmount = parseCleanNumber(fullAmountInput.value);
            const rawPercentage = parseCleanNumber(percentageInput.value);

            // Calculate percentage value: (Full Amount * Percentage) / 100
            const percentValue = (rawFullAmount * rawPercentage) / 100;

            // Calculate net amount based on selected mode
            let netAmount = 0;
            if (currentMode === 'add') {
                netAmount = rawFullAmount + percentValue;
            } else {
                netAmount = rawFullAmount - percentValue;
            }

            // Update UI Displays
            displayFullAmount.innerText = formatDisplayNumber(rawFullAmount, 4);
            displayPercentValue.innerText = (currentMode === 'add' ? '+' : '-') + formatDisplayNumber(percentValue, 4);
            displayNetAmount.innerText = formatDisplayNumber(netAmount, 4);
        }

        /**
         * Reset Calculator Inputs and Results
         */
        function resetCalculator() {
            fullAmountInput.value = '';
            percentageInput.value = '';
            displayFullAmount.innerText = '0';
            displayPercentValue.innerText = '0';
            displayNetAmount.innerText = '0.00';
            fullAmountInput.focus();
            showToast('ล้างข้อมูลเรียบร้อยแล้ว');
        }

        /**
         * Copy Net Result to Clipboard
         */
        function copyResult() {
            const resultText = displayNetAmount.innerText;
            if (resultText === '0.00' || resultText === '0') {
                showToast('ยังไม่มีผลลัพธ์ในการคัดลอก');
                return;
            }

            // Using standard document.execCommand('copy') for iframe security compatibility
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = resultText;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                document.execCommand('copy');
                showToast(`คัดลอกยอดสุทธิ ${resultText} บาท แล้ว`);
            } catch (err) {
                showToast('ไม่สามารถคัดลอกได้');
            } finally {
                document.body.removeChild(tempTextArea);
            }
        }

        /**
         * Custom Toast Notification Function (Replaces alert)
         */
        function showToast(message) {
            const container = document.getElementById('toastContainer');
            
            const toast = document.createElement('div');
            toast.className = 'bg-slate-800 text-white border border-slate-700 px-4 py-2.5 rounded-xl shadow-2xl text-xs sm:text-sm font-medium toast-animate flex items-center gap-2';
            toast.innerHTML = `
                <svg class="w-4 h-4 text-brandBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 2500);
        }

        // Initialize defaults on load
        window.onload = function() {
            calculate();
        };
    </script>
</body>
</html>
